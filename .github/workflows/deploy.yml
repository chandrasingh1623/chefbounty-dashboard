name: Deploy Dashboard to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build

    - name: Create deployment package
      run: |
        tar -czf dashboard-deploy.tar.gz \
          dist \
          client \
          server \
          shared \
          package*.json \
          ecosystem.config.js \
          tsconfig.json \
          vite.config.ts \
          tailwind.config.ts \
          postcss.config.js \
          components.json \
          drizzle.config.ts

    - name: Deploy to EC2
      env:
        PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        HOST: ${{ secrets.EC2_HOST }}
        USER: ${{ secrets.EC2_USER }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      run: |
        echo "$PRIVATE_KEY" > private_key
        chmod 600 private_key
        
        # Copy deployment package
        scp -o StrictHostKeyChecking=no -i private_key dashboard-deploy.tar.gz ${USER}@${HOST}:/tmp/
        
        # Deploy on server
        ssh -o StrictHostKeyChecking=no -i private_key ${USER}@${HOST} << ENDSSH
          # Navigate to app directory
          cd /home/ec2-user/chefbounty-dashboard
          
          # Create backup
          if [ -d "current" ]; then
            rm -rf previous
            mv current previous
          fi
          
          # Extract new deployment
          mkdir current
          cd current
          tar -xzf /tmp/dashboard-deploy.tar.gz
          
          # Create .env file
          cat > .env << EOF
NODE_ENV=production
PORT=3000
HOST=0.0.0.0
FRONTEND_URL=https://chefbounty.com
DATABASE_URL=\${DATABASE_URL}
RESEND_API_KEY=\${RESEND_API_KEY}
EOF
          
          # Install dependencies
          npm ci --production
          
          # Update PM2 ecosystem config
          cat > ecosystem.config.cjs << 'EOF'
module.exports = {
  apps: [{
    name: 'chefbounty-dashboard',
    script: './dist/index.js',
    env: {
      NODE_ENV: 'production',
      PORT: 3000,
      HOST: '0.0.0.0',
      FRONTEND_URL: 'https://chefbounty.com',
      DATABASE_URL: '\${DATABASE_URL}',
      RESEND_API_KEY: '\${RESEND_API_KEY}'
    }
  }]
};
EOF
          
          # Restart PM2
          pm2 restart chefbounty-dashboard || pm2 start ecosystem.config.cjs
          pm2 save
          
          # Clean up
          rm /tmp/dashboard-deploy.tar.gz
        ENDSSH
        
        # Clean up
        rm private_key